<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430">
  <!-- A11_pairwise_relation_geometry.svg · 第 11 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="430" fill="#FAF8F3"/>

  <!-- 左：三种关系卡片 -->
  <!-- A→B（祖先，蓝，实线箭头） -->
  <rect x="40" y="30" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <rect x="40" y="30" width="5" height="110" fill="#3A6EA5"/>
  <circle cx="95" cy="62" r="13" fill="#16263F"/><text x="95" y="67" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">A</text>
  <line x1="95" y1="77" x2="95" y2="100" stroke="#3A6EA5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="95,106 89,94 101,94" fill="#3A6EA5"/>
  <circle cx="95" cy="117" r="12" fill="#16263F"/><text x="95" y="122" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FAF8F3">B</text>
  <text x="140" y="78" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#3A6EA5">A → B：A 是 B 的祖先</text>
  <text x="140" y="106" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#16263F">φ<tspan dy="3" font-size="10">A</tspan><tspan dy="-3"> ≥ φ</tspan><tspan dy="3" font-size="10">B</tspan></text>

  <!-- B→A（反向祖先，橙，实线箭头） -->
  <rect x="40" y="165" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <rect x="40" y="165" width="5" height="110" fill="#D97925"/>
  <circle cx="95" cy="197" r="13" fill="#16263F"/><text x="95" y="202" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">B</text>
  <line x1="95" y1="212" x2="95" y2="235" stroke="#D97925" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="95,241 89,229 101,229" fill="#D97925"/>
  <circle cx="95" cy="252" r="12" fill="#16263F"/><text x="95" y="257" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FAF8F3">A</text>
  <text x="140" y="213" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#D97925">B → A：B 是 A 的祖先</text>
  <text x="140" y="241" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#16263F">φ<tspan dy="3" font-size="10">B</tspan><tspan dy="-3"> ≥ φ</tspan><tspan dy="3" font-size="10">A</tspan></text>

  <!-- branching（绿，虚线无箭头） -->
  <rect x="40" y="300" width="400" height="110" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <rect x="40" y="300" width="5" height="110" fill="#2E8B57"/>
  <circle cx="70" cy="355" r="13" fill="#16263F"/><text x="70" y="360" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">A</text>
  <line x1="85" y1="355" x2="110" y2="355" stroke="#2E8B57" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <circle cx="125" cy="355" r="13" fill="#16263F"/><text x="125" y="360" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">B</text>
  <text x="160" y="343" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#2E8B57">branching：位于不同分支</text>
  <text x="160" y="371" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#16263F">φ<tspan dy="3" font-size="10">A</tspan><tspan dy="-3"> + φ</tspan><tspan dy="3" font-size="10">B</tspan><tspan dy="-3"> ≤ 1</tspan></text>

  <!-- 右：频率约束几何区域 -->
  <text x="865" y="42" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#16263F">(φ<tspan dy="3" font-size="10">A</tspan><tspan dy="-3">, φ</tspan><tspan dy="3" font-size="10">B</tspan><tspan dy="-3">) 频率约束区域</tspan></text>

  <!-- 区域填充 -->
  <polygon points="740,330 990,330 990,80" fill="#3A6EA5" opacity="0.10"/>
  <polygon points="740,330 740,80 990,80" fill="#D97925" opacity="0.10"/>
  <polygon points="740,330 990,330 740,80" fill="#2E8B57" opacity="0.06"/>
  <!-- 边框与对角线 -->
  <rect x="740" y="80" width="250" height="250" fill="none" stroke="#C6CDD6" stroke-width="1.5"/>
  <line x1="740" y1="330" x2="990" y2="80" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="740,330 990,330 740,80" fill="none" stroke="#2E8B57" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- 坐标轴 -->
  <line x1="740" y1="330" x2="998" y2="330" stroke="#16263F" stroke-width="1.5"/>
  <polygon points="1004,330 994,325 994,335" fill="#16263F"/>
  <line x1="740" y1="330" x2="740" y2="72" stroke="#16263F" stroke-width="1.5"/>
  <polygon points="740,66 735,76 745,76" fill="#16263F"/>
  <text x="1006" y="354" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#16263F">φ<tspan dy="3" font-size="10">A</tspan></text>
  <text x="716" y="66" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#16263F">φ<tspan dy="3" font-size="10">B</tspan></text>
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#77809A">
    <text x="728" y="348">0</text><text x="986" y="348">1</text><text x="726" y="84">1</text>
  </g>
  <!-- 区域标注（颜色 + 文字 + 线型共同标识） -->
  <text x="905" y="298" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#3A6EA5">A→B</text>
  <text x="880" y="316" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3A6EA5">φ_A ≥ φ_B</text>
  <text x="778" y="112" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#D97925">B→A</text>
  <text x="768" y="130" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#D97925">φ_B ≥ φ_A</text>
  <text x="788" y="296" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#2E8B57">branching</text>
  <text x="772" y="312" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#2E8B57">φ_A+φ_B ≤ 1</text>

  <text x="550" y="424" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" fill="#77809A">约束来自无回突变与无限位点（ISA）式的树一致性假设</text>
</svg>
