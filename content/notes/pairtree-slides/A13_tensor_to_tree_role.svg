<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <!-- A13_tensor_to_tree_role.svg · 第 13 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="380" fill="#FAF8F3"/>

  <!-- 阶段 1：Pairs Tensor -->
  <rect x="40" y="90" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <text x="180" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#16263F">Pairs Tensor</text>
  <g stroke="#9AA3B2" stroke-width="0.75">
    <rect x="118" y="140" width="26" height="26" fill="#3A6EA5" opacity="0.35"/><rect x="144" y="140" width="26" height="26" fill="#D97925" opacity="0.35"/><rect x="170" y="140" width="26" height="26" fill="#2E8B57" opacity="0.35"/>
    <rect x="118" y="166" width="26" height="26" fill="#D97925" opacity="0.35"/><rect x="144" y="166" width="26" height="26" fill="#3A6EA5" opacity="0.35"/><rect x="170" y="166" width="26" height="26" fill="#2E8B57" opacity="0.35"/>
    <rect x="118" y="192" width="26" height="26" fill="#2E8B57" opacity="0.35"/><rect x="144" y="192" width="26" height="26" fill="#D97925" opacity="0.35"/><rect x="170" y="192" width="26" height="26" fill="#3A6EA5" opacity="0.35"/>
  </g>
  <text x="230" y="200" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#77809A">每对 supervariant</text>

  <!-- 箭头 1：guides proposal -->
  <line x1="320" y1="165" x2="430" y2="165" stroke="#0F7E79" stroke-width="3" stroke-linecap="round"/>
  <polygon points="436,165 424,159 424,171" fill="#0F7E79"/>
  <text x="375" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0F7E79">guides proposal</text>
  <text x="375" y="192" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#77809A">（指导，而非决定）</text>

  <!-- 阶段 2：candidate tree -->
  <rect x="440" y="90" width="280" height="150" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <text x="580" y="124" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#16263F">candidate tree（候选树）</text>
  <g>
    <line x1="580" y1="159" x2="552" y2="182" stroke="#16263F" stroke-width="2" stroke-linecap="round"/>
    <line x1="580" y1="159" x2="608" y2="182" stroke="#16263F" stroke-width="2" stroke-linecap="round"/>
    <line x1="552" y1="198" x2="552" y2="216" stroke="#16263F" stroke-width="2" stroke-linecap="round"/>
    <circle cx="580" cy="150" r="9" fill="#16263F"/><circle cx="552" cy="190" r="8" fill="#16263F"/><circle cx="608" cy="190" r="8" fill="#16263F"/><circle cx="552" cy="224" r="7" fill="#16263F"/>
  </g>

  <!-- 箭头 2：refit + likelihood -->
  <line x1="720" y1="165" x2="830" y2="165" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
  <polygon points="836,165 824,159 824,171" fill="#16263F"/>
  <text x="775" y="148" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#77809A">refit η/φ + global likelihood</text>

  <!-- 阶段 3：全局评价 -->
  <rect x="840" y="90" width="220" height="150" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <text x="950" y="124" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#16263F">全局评价</text>
  <rect x="885" y="145" width="130" height="14" rx="3" fill="#0F7E79"/>
  <rect x="885" y="170" width="82" height="14" rx="3" fill="#C6CDD6"/>
  <rect x="885" y="195" width="104" height="14" rx="3" fill="#C6CDD6"/>
  <text x="1022" y="157" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#0F7E79">best</text>

  <!-- 底部横幅 -->
  <rect x="40" y="292" width="1020" height="52" rx="12" fill="#E8ECF3"/>
  <text x="550" y="325" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#16263F"><tspan font-weight="700">pairwise posterior ≠ final tree posterior</tspan> —— 局部关系证据通过 proposal 与全局评价相连</text>
</svg>
