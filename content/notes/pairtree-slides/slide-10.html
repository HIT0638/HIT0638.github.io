<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第 10 页｜Supervariant：压缩 cluster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ECEAE4; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .slide { position: relative; width: 1280px; height: 720px; background: #FAF8F3; box-shadow: 0 8px 40px rgba(22,38,63,.10); overflow: hidden; }
  .pagetitle { position: absolute; left: 90px; top: 54px; font-size: 32px; font-weight: 700; color: #16263F; letter-spacing: .5px; }
  .takeaway { position: absolute; left: 90px; top: 106px; font-size: 19px; color: #46536E; max-width: 1100px; }
  .takeaway::before { content: ""; display: inline-block; width: 10px; height: 10px; background: #0F7E79; border-radius: 2px; margin-right: 12px; }
  .fig { position: absolute; left: 90px; right: 90px; top: 162px; text-align: center; }
  .fig svg { width: 1100px; max-width: 100%; height: auto; }
  .figcap { text-align: center; color: #77809A; font-size: 12.5px; margin-top: 2px; }
  .notebar { position: absolute; left: 90px; right: 90px; bottom: 84px; background: #ECEAE4; border-radius: 10px; padding: 12px 18px; font-size: 14px; color: #46536E; line-height: 1.6; }
  .footer { position: absolute; left: 90px; right: 90px; bottom: 30px; border-top: 1px solid #E7E2D6; padding-top: 12px; display: flex; justify-content: space-between; color: #77809A; font-size: 12.5px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="pagetitle">Supervariant：压缩 cluster</div>
    <div class="takeaway">把一个 cluster 压缩成后续分析的一个单位 —— 核心约束是<b>保持 expected variant reads</b></div>

    <div class="fig">
      <svg viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg">
        <text x="210" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#0F7E79">mutation cluster（同一 cluster 的多个突变）</text>
        <rect x="40" y="70" width="340" height="210" rx="14" fill="none" stroke="#0F7E79" stroke-width="1.5" stroke-dasharray="5 4"/>
        <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#16263F">
          <rect x="60" y="90" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#E7E2D6"/>
          <text x="210" y="124" text-anchor="middle">mut j₁&#160;&#160;&#160;V=38, T=100, ω=0.40</text>
          <rect x="60" y="158" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#E7E2D6"/>
          <text x="210" y="192" text-anchor="middle">mut j₂&#160;&#160;&#160;V=41, T=105, ω=0.38</text>
          <rect x="60" y="226" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#E7E2D6"/>
          <text x="210" y="260" text-anchor="middle">mut j₃&#160;&#160;&#160;V=35, T= 98, ω=0.42</text>
        </g>
        <line x1="390" y1="175" x2="462" y2="175" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
        <polygon points="468,175 456,169 456,181" fill="#16263F"/>
        <text x="426" y="158" text-anchor="middle" font-size="13" fill="#77809A">compress</text>
        <rect x="480" y="100" width="300" height="150" rx="14" fill="#E8ECF3" stroke="#16263F" stroke-width="2"/>
        <text x="630" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#16263F">supervariant</text>
        <g font-family="Georgia, serif" font-style="italic" font-size="16" fill="#16263F">
          <text x="630" y="174" text-anchor="middle">V* = min(V, N*)</text>
          <text x="630" y="200" text-anchor="middle">N* = 2 · N · ω</text>
          <text x="630" y="226" text-anchor="middle">ω* = 0.5</text>
        </g>
        <text x="420" y="340" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="21" fill="#16263F">E[V*] = N*·ω*·φ = N·ω·φ = E[V]</text>
        <text x="420" y="366" text-anchor="middle" font-size="12.5" fill="#77809A">（不触发 cap 的情形）</text>
        <rect x="830" y="312" width="250" height="52" rx="10" fill="#F3EFF7"/>
        <text x="955" y="334" text-anchor="middle" font-size="12" fill="#7B5EA7">保持的是期望 reads；</text>
        <text x="955" y="352" text-anchor="middle" font-size="12" fill="#7B5EA7">方差与完整 likelihood 不严格等价</text>
      </svg>
      <p class="figcap">示意图，基于 Pairtree 模型整理</p>
    </div>

    <div class="notebar"><b>为什么压缩</b>：减少后续 pairwise 比较与树搜索的规模。<b>为什么不能说成等价变换</b>：它只保证期望 reads 不变，不保证完整 likelihood、方差和误差结构一致。</div>

    <div class="footer"><div>Pairtree · 组会汇报</div><div>10 / 19</div></div>
  </div>
</body>
</html>
