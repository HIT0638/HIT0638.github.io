<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第 1 页｜Pairtree：从突变关系到亚克隆树</title>
<!--
  Pairtree 组会汇报 · 第 1 页（标题页）
  画布 1280×720（16:9）。在浏览器中打开即为 1:1 预览；
  树结构为内联矢量 SVG（与 A01_title_tree.svg 一致），可整体复制进飞书演示文稿。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ECEAE4;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .slide {
    position: relative;
    width: 1280px; height: 720px;
    background: #FAF8F3;                 /* 暖白背景 */
    box-shadow: 0 8px 40px rgba(22, 38, 63, 0.10);
    overflow: hidden;
  }

  /* 左侧文字区 */
  .left {
    position: absolute;
    left: 90px; top: 200px;
    width: 520px;
  }
  .accent-bar {
    width: 56px; height: 6px;
    background: #0F7E79;                 /* 青绿，少量强调 */
    border-radius: 3px;
    margin-bottom: 34px;
  }
  h1 {
    color: #16263F;                      /* 深海军蓝标题 */
    font-size: 48px; font-weight: 700;
    line-height: 1.35; letter-spacing: 0.5px;
  }
  .subtitle {
    margin-top: 30px;
    color: #46536E;
    font-size: 21px; line-height: 1.75;
    max-width: 480px;
  }
  .subtitle .hl { color: #0F7E79; font-weight: 600; }

  /* 右侧树结构 */
  .tree {
    position: absolute;
    right: 80px; top: 118px;
    width: 560px; height: 448px;
  }

  /* 底部：论文引用 + 汇报信息 */
  .footer {
    position: absolute;
    left: 90px; right: 90px; bottom: 30px;
    border-top: 1px solid #E7E2D6;
    padding-top: 14px;
    display: flex; justify-content: space-between; align-items: baseline;
    color: #77809A; font-size: 12.5px; line-height: 1.5;
  }
  .footer .cite { max-width: 860px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="left">
      <div class="accent-bar"></div>
      <h1>Pairtree：<br>从突变关系到亚克隆树</h1>
      <p class="subtitle">利用<span class="hl">突变之间的关系</span>，从 bulk sequencing 信号恢复亚克隆结构</p>
    </div>

    <svg class="tree" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
      <!-- pairwise relation 虚线: m2 与 m3 (branching) -->
      <path d="M 146 252 Q 300 165 457 252" fill="none" stroke="#0F7E79" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.85"/>
      <!-- pairwise relation 虚线: m1 与 m3 (祖先-后代) -->
      <path d="M 338 86 Q 435 150 460 252" fill="none" stroke="#D97925" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.85"/>
      <!-- 克隆树边 -->
      <line x1="300" y1="142" x2="176" y2="266" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
      <line x1="300" y1="142" x2="424" y2="266" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
      <line x1="170" y1="318" x2="170" y2="416" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
      <!-- 克隆节点 -->
      <circle cx="300" cy="110" r="32" fill="#16263F"/>
      <circle cx="170" cy="290" r="28" fill="#16263F"/>
      <circle cx="430" cy="290" r="28" fill="#16263F"/>
      <circle cx="170" cy="440" r="24" fill="#16263F"/>
      <!-- 突变标记 -->
      <circle cx="336" cy="82"  r="7" fill="#0F7E79"/>
      <circle cx="140" cy="258" r="7" fill="#D97925"/>
      <circle cx="462" cy="258" r="7" fill="#0F7E79"/>
      <circle cx="139" cy="413" r="7" fill="#D97925"/>
      <!-- 节点标签 -->
      <text x="300" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#FAF8F3">C1</text>
      <text x="170" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#FAF8F3">C2</text>
      <text x="430" y="296" text-anchor="middle" font-size="15" font-weight="600" fill="#FAF8F3">C3</text>
      <text x="170" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#FAF8F3">C4</text>
      <!-- 图注 -->
      <text x="300" y="477" text-anchor="middle" font-size="13" fill="#77809A">虚线：突变之间的 pairwise relation（示意）</text>
    </svg>

    <div class="footer">
      <div class="cite">Wintersinger JA, Dobson SM, Kulman E, Stein LD, Dick JE, Morris Q. Reconstructing Complex Cancer Evolutionary Histories from Multiple Bulk DNA Samples Using Pairtree. <i>Blood Cancer Discov.</i> 2022;3(3):208–219.</div>
      <div>汇报人：tb &nbsp;·&nbsp; 2026-07</div>
    </div>
  </div>
</body>
</html>
