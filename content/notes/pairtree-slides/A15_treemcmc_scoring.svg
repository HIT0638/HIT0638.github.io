<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400">
  <!-- A15_treemcmc_scoring.svg · 第 15 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="400" fill="#FAF8F3"/>

  <!-- 上层：结构层 -->
  <text x="40" y="44" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#16263F">① 结构层：topology move</text>
  <g>
    <line x1="110" y1="96" x2="82" y2="120" stroke="#16263F" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="96" x2="138" y2="120" stroke="#16263F" stroke-width="2" stroke-linecap="round"/>
    <line x1="138" y1="139" x2="138" y2="156" stroke="#16263F" stroke-width="2" stroke-linecap="round"/>
    <circle cx="110" cy="84" r="12" fill="#16263F"/><circle cx="78" cy="130" r="11" fill="#16263F"/><circle cx="138" cy="130" r="11" fill="#16263F"/>
    <circle cx="138" cy="168" r="10" fill="#16263F" stroke="#D97925" stroke-width="2.5"/>
  </g>
  <line x1="110" y1="196" x2="110" y2="224" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="110,230 104,218 116,218" fill="#16263F"/>

  <!-- 下层：频率拟合与 MH -->
  <rect x="40" y="240" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
  <text x="140" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#16263F">② 拟合频率 η</text>
  <text x="140" y="288" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#77809A">在候选树约束下求解</text>

  <line x1="240" y1="272" x2="276" y2="272" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="282,272 272,267 272,277" fill="#16263F"/>

  <rect x="284" y="240" width="166" height="64" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
  <text x="367" y="268" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#16263F">φ = Zη</text>
  <text x="367" y="290" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#77809A">由树结构推出 prevalence</text>

  <line x1="450" y1="272" x2="486" y2="272" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="492,272 482,267 482,277" fill="#16263F"/>

  <rect x="494" y="240" width="206" height="64" rx="10" fill="#FFFFFF" stroke="#D8D2C4"/>
  <text x="597" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#16263F">全局 read likelihood</text>
  <text x="597" y="288" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#77809A">整棵树的观测似然</text>

  <line x1="700" y1="272" x2="726" y2="272" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="732,272 722,267 722,277" fill="#16263F"/>

  <!-- MH 决策菱形 -->
  <polygon points="805,222 880,272 805,322 730,272" fill="#FAECE0" stroke="#D97925" stroke-width="2"/>
  <text x="805" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#D97925">MH</text>
  <text x="805" y="288" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#D97925">接受？</text>

  <!-- accept / reject -->
  <line x1="862" y1="246" x2="948" y2="234" stroke="#2E8B57" stroke-width="2" stroke-linecap="round"/>
  <polygon points="954,233 943,228 945,240" fill="#2E8B57"/>
  <text x="908" y="224" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#2E8B57">accept</text>
  <line x1="862" y1="298" x2="948" y2="310" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round"/>
  <polygon points="954,311 945,304 943,316" fill="#9AA3B2"/>
  <text x="908" y="330" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#77809A">reject</text>

  <!-- 输出 -->
  <rect x="958" y="232" width="126" height="88" rx="10" fill="#E8ECF3" stroke="#D8D2C4"/>
  <text x="1021" y="258" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#16263F">迭代收敛后</text>
  <text x="1021" y="281" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#46536E">树后验样本 /</text>
  <text x="1021" y="299" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#46536E">consensus tree</text>

  <!-- 底部说明 -->
  <text x="550" y="376" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#46536E">tensor 负责引导搜索；候选树是否保留，由结构约束下的频率拟合与全局似然决定</text>
</svg>
