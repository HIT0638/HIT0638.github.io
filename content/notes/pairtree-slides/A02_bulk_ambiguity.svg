<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400">
  <!-- A02_bulk_ambiguity.svg · 第 2 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="400" fill="#FAF8F3"/>

  <!-- 左：肿瘤样本细胞混合 -->
  <text x="170" y="46" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#16263F">肿瘤样本（bulk sample）</text>
  <rect x="20" y="64" width="300" height="230" rx="14" fill="#FFFFFF" stroke="#E7E2D6"/>
  <g>
    <circle cx="60" cy="106" r="13" fill="#C6CDD6"/><circle cx="105" cy="106" r="13" fill="#0F7E79"/><circle cx="150" cy="106" r="13" fill="#C6CDD6"/><circle cx="195" cy="106" r="13" fill="#D97925"/><circle cx="240" cy="106" r="13" fill="#0F7E79"/><circle cx="285" cy="106" r="13" fill="#C6CDD6"/>
    <circle cx="60" cy="150" r="13" fill="#0F7E79"/><circle cx="105" cy="150" r="13" fill="#C6CDD6"/><circle cx="150" cy="150" r="13" fill="#16263F"/><circle cx="195" cy="150" r="13" fill="#C6CDD6"/><circle cx="240" cy="150" r="13" fill="#D97925"/><circle cx="285" cy="150" r="13" fill="#0F7E79"/>
    <circle cx="60" cy="194" r="13" fill="#C6CDD6"/><circle cx="105" cy="194" r="13" fill="#D97925"/><circle cx="150" cy="194" r="13" fill="#0F7E79"/><circle cx="195" cy="194" r="13" fill="#C6CDD6"/><circle cx="240" cy="194" r="13" fill="#16263F"/><circle cx="285" cy="194" r="13" fill="#D97925"/>
    <circle cx="60" cy="238" r="13" fill="#0F7E79"/><circle cx="105" cy="238" r="13" fill="#C6CDD6"/><circle cx="150" cy="238" r="13" fill="#D97925"/><circle cx="195" cy="238" r="13" fill="#C6CDD6"/><circle cx="240" cy="238" r="13" fill="#0F7E79"/><circle cx="285" cy="238" r="13" fill="#C6CDD6"/>
  </g>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" fill="#77809A">
    <circle cx="46" cy="320" r="6" fill="#C6CDD6"/><text x="58" y="325">正常细胞</text>
    <circle cx="146" cy="320" r="6" fill="#0F7E79"/><text x="158" y="325">亚克隆 C1</text>
    <circle cx="246" cy="320" r="6" fill="#D97925"/><text x="258" y="325">C2</text>
    <circle cx="296" cy="320" r="6" fill="#16263F"/><text x="308" y="325">C3</text>
  </g>
  <text x="170" y="362" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#77809A">正常细胞与多个亚克隆混合在同一样本中</text>

  <!-- 箭头 1 -->
  <line x1="340" y1="180" x2="386" y2="180" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
  <polygon points="392,180 378,173 378,187" fill="#16263F"/>

  <!-- 中：bulk reads / VAF -->
  <text x="520" y="66" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#16263F">bulk reads → VAF</text>
  <text x="520" y="88" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#77809A">（变异等位基因频率，示意）</text>
  <line x1="460" y1="102" x2="460" y2="222" stroke="#C6CDD6" stroke-width="1"/>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#46536E">
    <text x="398" y="127">mut a</text>
    <text x="398" y="167">mut b</text>
    <text x="398" y="207">mut c</text>
  </g>
  <rect x="460" y="110" width="200" height="20" rx="3" fill="#16263F"/>
  <rect x="460" y="150" width="111" height="20" rx="3" fill="#16263F"/>
  <rect x="460" y="190" width="111" height="20" rx="3" fill="#16263F"/>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#77809A">
    <text x="668" y="125">≈ 45%</text>
    <text x="579" y="165">≈ 25%</text>
    <text x="579" y="205">≈ 25%</text>
  </g>
  <text x="540" y="270" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#77809A">同一组 bulk 频率模式</text>

  <!-- 问号 -->
  <text x="745" y="205" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="58" font-weight="700" fill="#D97925">?</text>

  <!-- 右：两棵候选树 -->
  <text x="930" y="46" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#16263F">同一频率 → 多棵可能的树</text>
  <g>
    <line x1="850" y1="111" x2="850" y2="151" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="850" y1="180" x2="850" y2="218" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="850" cy="96" r="15" fill="#16263F"/><circle cx="850" cy="166" r="14" fill="#16263F"/><circle cx="850" cy="232" r="13" fill="#16263F"/>
    <text x="874" y="101" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" fill="#46536E">a</text>
    <text x="872" y="171" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" fill="#46536E">b</text>
    <text x="870" y="237" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" fill="#46536E">c</text>
    <text x="850" y="286" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#46536E">候选树 1：线性演化</text>
  </g>
  <g>
    <line x1="1010" y1="111" x2="972" y2="168" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1010" y1="111" x2="1048" y2="168" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1010" cy="96" r="15" fill="#16263F"/><circle cx="972" cy="182" r="14" fill="#16263F"/><circle cx="1048" cy="182" r="14" fill="#16263F"/>
    <text x="1032" y="101" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" fill="#46536E">a</text>
    <text x="972" y="216" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" fill="#46536E">b</text>
    <text x="1048" y="216" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5" fill="#46536E">c</text>
    <text x="1010" y="286" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#46536E">候选树 2：分支演化</text>
  </g>
</svg>
