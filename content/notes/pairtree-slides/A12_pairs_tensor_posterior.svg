<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400">
  <!-- A12_pairs_tensor_posterior.svg · 第 12 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="400" fill="#FAF8F3"/>

  <text x="330" y="48" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#16263F">在各关系允许的区域 Ω<tspan dy="3" font-size="10">r</tspan><tspan dy="-3"> 内积分 read evidence</tspan></text>

  <!-- 三个积分区域小图 -->
  <!-- A→B -->
  <polygon points="60,220 210,220 210,70" fill="#3A6EA5" opacity="0.12"/>
  <rect x="60" y="70" width="150" height="150" fill="none" stroke="#C6CDD6" stroke-width="1.2"/>
  <g fill="#3A6EA5" opacity="0.75">
    <circle cx="180" cy="200" r="3"/><circle cx="195" cy="185" r="3"/><circle cx="160" cy="210" r="3"/><circle cx="200" cy="210" r="3"/><circle cx="175" cy="190" r="3"/><circle cx="190" cy="170" r="3"/><circle cx="150" cy="215" r="3"/><circle cx="205" cy="150" r="3"/><circle cx="185" cy="205" r="3"/><circle cx="170" cy="200" r="3"/><circle cx="200" cy="190" r="3"/><circle cx="195" cy="120" r="3"/>
  </g>
  <text x="135" y="248" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#16263F">P(D | A→B)</text>

  <!-- B→A -->
  <polygon points="260,220 260,70 410,70" fill="#D97925" opacity="0.12"/>
  <rect x="260" y="70" width="150" height="150" fill="none" stroke="#C6CDD6" stroke-width="1.2"/>
  <g fill="#D97925" opacity="0.75">
    <circle cx="280" cy="100" r="3"/><circle cx="300" cy="90" r="3"/><circle cx="275" cy="130" r="3"/><circle cx="290" cy="110" r="3"/><circle cx="320" cy="85" r="3"/><circle cx="270" cy="160" r="3"/><circle cx="310" cy="95" r="3"/><circle cx="285" cy="140" r="3"/><circle cx="305" cy="105" r="3"/><circle cx="295" cy="120" r="3"/><circle cx="270" cy="110" r="3"/><circle cx="330" cy="80" r="3"/>
  </g>
  <text x="335" y="248" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#16263F">P(D | B→A)</text>

  <!-- branching -->
  <polygon points="460,220 610,220 460,70" fill="#2E8B57" opacity="0.10"/>
  <rect x="460" y="70" width="150" height="150" fill="none" stroke="#C6CDD6" stroke-width="1.2"/>
  <g fill="#2E8B57" opacity="0.75">
    <circle cx="480" cy="200" r="3"/><circle cx="500" cy="210" r="3"/><circle cx="470" cy="180" r="3"/><circle cx="520" cy="200" r="3"/><circle cx="490" cy="190" r="3"/><circle cx="540" cy="200" r="3"/><circle cx="480" cy="150" r="3"/><circle cx="510" cy="170" r="3"/><circle cx="560" cy="210" r="3"/><circle cx="470" cy="120" r="3"/>
  </g>
  <text x="535" y="248" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#16263F">P(D | branching)</text>

  <!-- 箭头 -->
  <line x1="645" y1="145" x2="705" y2="145" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
  <polygon points="711,145 699,139 699,151" fill="#16263F"/>

  <!-- 右：关系后验 vector -->
  <text x="880" y="48" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#16263F">关系后验 P(r | D<tspan dy="3" font-size="10">AB</tspan><tspan dy="-3">)</tspan></text>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#46536E" text-anchor="end">
    <text x="725" y="106">A→B</text><text x="725" y="166">B→A</text><text x="725" y="226">branching</text>
  </g>
  <rect x="735" y="90" width="186" height="22" rx="3" fill="#3A6EA5"/>
  <rect x="735" y="150" width="69" height="22" rx="3" fill="#D97925"/>
  <rect x="735" y="210" width="45" height="22" rx="3" fill="#2E8B57"/>
  <g font-family="Georgia, serif" font-size="13" fill="#77809A">
    <text x="929" y="106">0.62</text><text x="812" y="166">0.23</text><text x="788" y="226">0.15</text>
  </g>
  <text x="880" y="262" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#77809A">（示意数值，结合关系先验 P(r) 归一化）</text>

  <!-- 底部结论 -->
  <text x="550" y="330" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#46536E">tensor 的一个元素 = 三种关系的后验分布，<tspan font-weight="700" fill="#16263F">而不是一条确定的边</tspan></text>
</svg>
