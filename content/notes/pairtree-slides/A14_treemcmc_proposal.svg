<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
  <!-- A14_treemcmc_proposal.svg · 第 14 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="380" fill="#FAF8F3"/>

  <!-- 当前树 -->
  <g>
    <line x1="180" y1="96" x2="140" y2="145" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="180" y1="96" x2="220" y2="145" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="175" x2="140" y2="226" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="180" cy="80" r="16" fill="#16263F"/><circle cx="140" cy="160" r="15" fill="#16263F"/><circle cx="220" cy="160" r="15" fill="#16263F"/>
    <circle cx="140" cy="240" r="14" fill="#16263F" stroke="#D97925" stroke-width="3"/>
    <text x="180" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">C1</text>
    <text x="140" y="165" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">C2</text>
    <text x="220" y="165" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">C3</text>
    <text x="140" y="245" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FAF8F3">C4</text>
    <text x="180" y="300" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#46536E">当前树</text>
  </g>

  <!-- 中间箭头说明 -->
  <line x1="330" y1="150" x2="420" y2="150" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
  <polygon points="426,150 414,144 414,156" fill="#16263F"/>
  <text x="375" y="130" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#16263F">一次 proposal：移动 C4</text>
  <text x="375" y="176" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#77809A">改变 parent / 调整局部拓扑</text>

  <!-- local move 示意（灰色原树 + 虚线移动） -->
  <g opacity="0.55">
    <line x1="580" y1="96" x2="540" y2="145" stroke="#9AA3B2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="580" y1="96" x2="620" y2="145" stroke="#9AA3B2" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="580" cy="80" r="16" fill="#C6CDD6"/><circle cx="540" cy="160" r="15" fill="#C6CDD6"/><circle cx="620" cy="160" r="15" fill="#C6CDD6"/>
  </g>
  <circle cx="540" cy="240" r="14" fill="none" stroke="#D97925" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 540 256 Q 580 302 620 256" fill="none" stroke="#D97925" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <polygon points="620,252 612,260 624,264" fill="#D97925"/>
  <circle cx="620" cy="240" r="14" fill="#16263F" stroke="#D97925" stroke-width="3"/>
  <text x="620" y="245" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FAF8F3">C4</text>
  <text x="580" y="330" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#D97925">C4：C2 下 → C3 下（tensor 倾向的位置）</text>

  <!-- 候选树 -->
  <g>
    <line x1="920" y1="96" x2="880" y2="145" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="920" y1="96" x2="960" y2="145" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="960" y1="175" x2="960" y2="226" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="920" cy="80" r="16" fill="#16263F"/><circle cx="880" cy="160" r="15" fill="#16263F"/><circle cx="960" cy="160" r="15" fill="#16263F"/>
    <circle cx="960" cy="240" r="14" fill="#16263F" stroke="#D97925" stroke-width="3"/>
    <text x="920" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">C1</text>
    <text x="880" y="165" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">C2</text>
    <text x="960" y="165" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FAF8F3">C3</text>
    <text x="960" y="245" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FAF8F3">C4</text>
    <text x="920" y="300" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#46536E">候选树</text>
  </g>

  <!-- 底部说明 -->
  <text x="550" y="364" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#46536E">Pairs Tensor 提供关系倾向（C4 更可能移向 C3），但候选位置必须满足树的可行性</text>
</svg>
