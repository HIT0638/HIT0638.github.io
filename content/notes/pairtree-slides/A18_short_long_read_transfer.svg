<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430">
  <!-- A18_short_long_read_transfer.svg · 第 18 页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <rect width="1100" height="430" fill="#FAF8F3"/>

  <!-- 左：short-read bulk -->
  <rect x="40" y="50" width="480" height="190" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <text x="280" y="82" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#16263F">short-read bulk（当前 Pairtree）</text>
  <g>
    <rect x="70" y="100" width="120" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="90" y="122" width="140" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="70" y="144" width="100" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="110" y="166" width="130" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="80" y="188" width="110" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="70" y="210" width="120" height="10" rx="5" fill="#C6CDD6"/>
    <circle cx="150" cy="105" r="6" fill="#0F7E79"/><circle cx="150" cy="127" r="6" fill="#0F7E79"/><circle cx="150" cy="171" r="6" fill="#0F7E79"/>
    <circle cx="210" cy="127" r="6" fill="#D97925"/><circle cx="150" cy="149" r="6" fill="#D97925"/><circle cx="170" cy="193" r="6" fill="#D97925"/>
  </g>
  <text x="280" y="232" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#77809A">关系证据：V / T + ω（跨样本频率）</text>

  <!-- 右：long-read -->
  <rect x="580" y="50" width="480" height="190" rx="12" fill="#FFFFFF" stroke="#E7E2D6"/>
  <text x="820" y="82" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#16263F">long-read（三代数据）</text>
  <g>
    <rect x="610" y="105" width="400" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="610" y="135" width="400" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="610" y="165" width="400" height="10" rx="5" fill="#C6CDD6"/>
    <rect x="610" y="195" width="400" height="10" rx="5" fill="#C6CDD6"/>
    <circle cx="700" cy="110" r="6" fill="#0F7E79"/><circle cx="820" cy="110" r="6" fill="#D97925"/>
    <circle cx="700" cy="140" r="6" fill="#0F7E79"/>
    <circle cx="820" cy="170" r="6" fill="#D97925"/><circle cx="900" cy="170" r="6" fill="#16263F"/>
    <circle cx="700" cy="200" r="6" fill="#0F7E79"/><circle cx="820" cy="200" r="6" fill="#D97925"/><circle cx="900" cy="200" r="6" fill="#16263F"/>
  </g>
  <text x="820" y="232" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#77809A">关系证据：molecule-level 共现 / 相位（同一分子上的突变）</text>

  <!-- 下行箭头 -->
  <line x1="280" y1="248" x2="280" y2="290" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="280,296 274,284 286,284" fill="#16263F"/>
  <line x1="820" y1="248" x2="820" y2="290" stroke="#16263F" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="820,296 814,284 826,284" fill="#16263F"/>

  <!-- 共同推断层 -->
  <rect x="240" y="296" width="620" height="60" rx="12" fill="#16263F"/>
  <text x="550" y="332" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15.5" font-weight="600" fill="#FAF8F3">共同推断层：pairwise evidence → relation posterior → 全局树搜索</text>

  <!-- 两侧标签 -->
  <rect x="40" y="296" width="180" height="60" rx="10" fill="#F3EFF7" stroke="#7B5EA7" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="130" y="321" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#7B5EA7">需重建：observation layer</text>
  <text x="130" y="339" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5" fill="#7B5EA7">错误模型 / ω 不确定性</text>
  <rect x="880" y="296" width="180" height="60" rx="10" fill="#FAECE0" stroke="#D97925" stroke-width="1.2"/>
  <text x="970" y="321" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#D97925">架构迁移</text>
  <text x="970" y="339" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#D97925">≠ 直接套用</text>

  <!-- 进一步问题 -->
  <text x="550" y="404" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#46536E">进一步问题：是否还需要 supervariant？关系状态是否加入「同一 molecule / haplotype」？</text>
</svg>
