<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <!-- A01_title_tree.svg · 第 1 页标题页视觉资产 · 示意图，基于 Pairtree 模型整理 -->
  <!-- 配色: 深海军蓝 #16263F (树结构) / 青绿 #0F7E79 (强调) / 橙 #D97925 (强调) / 暖白 #FAF8F3 (背景) -->
  <rect width="600" height="480" fill="#FAF8F3"/>

  <!-- pairwise relation 虚线: 突变 m2 与 m3 (branching) -->
  <path d="M 146 252 Q 300 165 457 252" fill="none" stroke="#0F7E79" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.85"/>
  <!-- pairwise relation 虚线: 突变 m1 与 m3 (祖先-后代) -->
  <path d="M 338 86 Q 435 150 460 252" fill="none" stroke="#D97925" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.85"/>

  <!-- 克隆树边 -->
  <line x1="300" y1="142" x2="176" y2="266" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="142" x2="424" y2="266" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="318" x2="170" y2="416" stroke="#16263F" stroke-width="3" stroke-linecap="round"/>

  <!-- 克隆节点 -->
  <circle cx="300" cy="110" r="32" fill="#16263F"/>
  <circle cx="170" cy="290" r="28" fill="#16263F"/>
  <circle cx="430" cy="290" r="28" fill="#16263F"/>
  <circle cx="170" cy="440" r="24" fill="#16263F"/>

  <!-- 突变标记 (色点) -->
  <circle cx="336" cy="82"  r="7" fill="#0F7E79"/>
  <circle cx="140" cy="258" r="7" fill="#D97925"/>
  <circle cx="462" cy="258" r="7" fill="#0F7E79"/>
  <circle cx="139" cy="413" r="7" fill="#D97925"/>

  <!-- 节点标签 -->
  <text x="300" y="116" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FAF8F3">C1</text>
  <text x="170" y="296" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#FAF8F3">C2</text>
  <text x="430" y="296" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#FAF8F3">C3</text>
  <text x="170" y="446" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#FAF8F3">C4</text>

  <!-- 图注 -->
  <text x="300" y="477" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#77809A">虚线：突变之间的 pairwise relation（示意）</text>
</svg>
